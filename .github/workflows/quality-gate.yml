name: Quality Gate + Drip Feed

on:
  # 정기 발행 소유자는 vercel.json의 /api/cron/publish 한 곳입니다.
  # GitHub Actions는 장애 대응용 수동 실행만 유지합니다.
  workflow_dispatch:

jobs:
  drip-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run quality gate & drip feed
        run: npx tsx scripts/publish/drip-feed.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
